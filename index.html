<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FraudGuard AI | Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand-mark">FG</div>
    <h1>FraudGuard AI</h1>
    <p class="muted">AI-Based Financial Fraud Detection System</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <label>Username</label>
      <input name="username" required autocomplete="username">
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password">
      <button class="btn primary full" type="submit">Secure Login</button>
    </form>
    <p class="small">Local IPD demonstration application</p>
  </div>
</body>
</html>
